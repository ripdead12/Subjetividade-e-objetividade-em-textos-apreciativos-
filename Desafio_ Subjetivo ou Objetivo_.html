#app{width:100%;max-width:760px}
.card{background:var(--card);border:4px solid var(--line);border-radius:28px;box-shadow:8px 8px 0 var(--line);padding:22px;text-align:center}
h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.05;margin:8px 0;font-weight:700}
h2{font-size:clamp(1.5rem,5vw,2.2rem);margin:8px 0;font-weight:700}
p{font-size:1.2rem;line-height:1.4;margin:8px 0}
.muted{color:var(--muted)}
.btn{font-family:inherit;font-weight:700;font-size:clamp(1.3rem,5vw,1.9rem);color:var(--btntext);border:4px solid var(--line);border-radius:22px;
  padding:16px 22px;cursor:pointer;box-shadow:0 6px 0 var(--line);transition:transform .08s,box-shadow .08s;min-height:64px;width:100%}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.btn:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
.go{background:var(--orange)} .sub{background:var(--pink)} .obj{background:var(--blue)} .next{background:var(--green)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-weight:600}
.pill{background:var(--yellow);color:#1d1b4b;border:3px solid var(--line);border-radius:999px;padding:4px 14px;font-size:1.05rem}
.bar{height:16px;border:3px solid var(--line);border-radius:999px;background:#fff;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--green);transition:width .4s}
.bubble{position:relative;background:#fff;color:#1d1b4b;border:4px solid var(--line);border-radius:26px;padding:20px 18px;font-size:clamp(1.5rem,5.5vw,2.2rem);font-weight:600;line-height:1.25;margin:0 0 6px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-20px;width:26px;height:26px;background:#fff;border-right:4px solid var(--line);border-bottom:4px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.who{margin-top:22px}
.who svg{width:110px;height:110px}
.hero{display:flex;justify-content:center;gap:4px;align-items:flex-end}
.hero svg{width:clamp(80px,24vw,130px);height:auto}
.pic{border:4px solid var(--line);border-radius:50%;object-fit:cover;aspect-ratio:1;background:#fff;box-shadow:0 4px 0 var(--line)}
.hero .pic{width:clamp(80px,24vw,130px);height:auto}
.who .pic{width:110px;height:110px}
.rule{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
@media (max-width:520px){.rule{grid-template-columns:1fr}}
.rule div{border:3px solid var(--line);border-radius:18px;padding:10px;font-size:1.1rem;color:#1d1b4b}
.rule .s{background:#ffc2dd}.rule .o{background:#bcd3ff}
.rule b{display:block;font-size:1.3rem}
.res{font-size:clamp(1.8rem,7vw,2.6rem);font-weight:700;margin:6px 0}
.ok{color:var(--green)}.no{color:var(--red)}
.ans{display:inline-block;color:#fff;border:4px solid var(--line);border-radius:18px;padding:6px 18px;font-size:1.6rem;font-weight:700;margin:6px 0}
.why{background:#fff8c4;color:#1d1b4b;border:3px dashed var(--line);border-radius:18px;padding:12px;font-size:1.25rem;margin:12px 0 16px}
.big{font-size:clamp(3rem,14vw,5.5rem);font-weight:700;line-height:1;margin:6px 0}
.stars{font-size:2.4rem;letter-spacing:4px}
.rev{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.rev span{border:3px solid var(--line);border-radius:12px;padding:6px 0;font-weight:700;color:#fff}
.rev .g{background:var(--green)}.rev .r{background:var(--red)}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.btn,.bar i{transition:none}}
</style>

const chars=[cat,fish,bunny];
let i=0,score=0,hist=[];
const app=document.getElementById('app');
const show=h=>{app.innerHTML=h;window.scrollTo(0,0)};
const head=()=>`<div class="top"><span class="pill">${phase(i)}</span><span class="pill">Pontos: ${score}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div>`;

function home(){i=0;score=0;hist=[];
show(`<div class="card pop"><div class="hero">${cat}${fish}${bunny}</div>
<h1>Desafio: Subjetivo ou Objetivo?</h1>
<p class="muted">Textos apreciativos em Elmore. 10 perguntas, 3 fases e 100 pontos.</p>
<button class="btn go" onclick="how()">COMEÇAR</button></div>`)}

function how(){show(`<div class="card pop"><h2>Como jogar</h2>
<p>Leia a frase e escolha se ela é subjetiva ou objetiva. Cada acerto vale +10 pontos.</p>
<div class="rule"><div class="s"><b>SUBJETIVA</b>Opinião, sentimento ou impressão pessoal.</div><div class="o"><b>OBJETIVA</b>Informação ou fato que pode ser verificado.</div></div>
<button class="btn go" onclick="ask()">VAMOS!</button></div>`)}

function ask(){const q=Q[i];
show(`<div class="card pop">${head()}
<p class="muted">Pergunta ${i+1} de ${Q.length}</p>
<p class="bubble">“${q[0]}”</p>
<div class="who">${chars[i%3]}</div>
<div class="row"><button class="btn sub" onclick="pick('S')">A) SUBJETIVA</button><button class="btn obj" onclick="pick('O')">B) OBJETIVA</button></div></div>`)}

function pick(c){const q=Q[i],hit=c===q[1];
if(hit)score+=10;hist.push(hit);
const name=q[1]==='S'?'SUBJETIVA':'OBJETIVA',col=q[1]==='S'?'var(--pink)':'var(--blue)';
const last=i===Q.length-1;
show(`<div class="card pop"><div class="top"><span class="pill">${phase(i)}</span><span class="pill">Pontos: ${score}</span></div>
<div class="res ${hit?'ok':'no'}">${hit?'Acertou! +10 pontos':'Ops! 0 pontos'}</div>
<p>Resposta correta:</p><div class="ans" style="background:${col}">${name}</div>
<div class="why">${q[2]}</div>
<button class="btn next" onclick="${last?'end()':'nxt()'}">${last?'VER MEU RESULTADO':'PRÓXIMA PERGUNTA'}</button></div>`)}

function nxt(){i++;ask()}

function end(){
const n=score/10,stars='★'.repeat(n>=8?3:n>=4?2:1)+'☆'.repeat(n>=8?0:n>=4?1:2);
const msg=n>=8?'Incrível! Você é mestre em subjetividade e objetividade!':n>=4?'Muito bem! Você está quase lá!':'Bom começo! Tente de novo para melhorar!';
show(`<div class="card pop"><div class="hero">${cat}${fish}${bunny}</div>
<h2>Parabéns! Você aprendeu a diferenciar subjetividade e objetividade!</h2>
<div class="big">${score}<span class="muted" style="font-size:.4em"> / 100</span></div>
<div class="stars" style="color:var(--orange)">${stars}</div>
<p>${n} de ${Q.length} acertos. ${msg}</p>
<div class="rev">${hist.map((h,k)=>`<span class="${h?'g':'r'}">${k+1} ${h?'✔':'✖'}</span>`).join('')}</div>
<div class="rule"><div class="s"><b>Subjetiva</b>Tem opinião ou sentimento.</div><div class="o"><b>Objetiva</b>Tem fato verificável.</div></div>
<button class="btn go" onclick="home()">JOGAR DE NOVO</button></div>`)}
home();
</script>
